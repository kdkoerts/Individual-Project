version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ip_postgres
    environment:
      POSTGRES_DB: ip_database
      POSTGRES_USER: ip_user
      POSTGRES_PASSWORD: ip_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ip_user -d ip_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ip_network

  app:
    build: .
    container_name: ip_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ip_database
      SPRING_DATASOURCE_USERNAME: ip_user
      SPRING_DATASOURCE_PASSWORD: ip_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    networks:
      - ip_network

networks:
  ip_network:
    driver: bridge

volumes:
  postgres_data:
